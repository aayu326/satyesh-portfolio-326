  <!-- ═══════════════════════════════════════════════════════
       CHATBOT WIDGET — Satyesh Kumar Singh
       Live iframe pointed at the deployed Vercel chatbot app.
       Any update pushed to satyesh-portfolio-chatbot.vercel.app
       is reflected here automatically — no HTML changes needed.
       ═══════════════════════════════════════════════════════ -->
  <style>
    .chat-toggle-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      z-index: 9999;
      background: linear-gradient(135deg, #1a4a2e 0%, #0d2d1a 100%);
      box-shadow: 0 8px 25px rgba(26,74,46,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .chat-toggle-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 35px rgba(26,74,46,0.6);
    }
    .chat-toggle-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .chat-toggle-btn .chat-close-icon {
      display: none;
      width: 28px;
      height: 28px;
      fill: white;
    }
    .chat-toggle-btn.active img { display: none; }
    .chat-toggle-btn.active .chat-close-icon { display: block; }
    .chat-toggle-btn.active { background: linear-gradient(135deg, #c47f2a 0%, #a06520 100%); }

    .chat-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: linear-gradient(135deg, #c47f2a 0%, #a06520 100%);
      color: white;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      border: 3px solid white;
      box-shadow: 0 3px 10px rgba(196,127,42,0.4);
    }
    .chat-badge.hidden { display: none; }

    .chat-bubble {
      position: fixed;
      bottom: 100px;
      right: 20px;
      background: linear-gradient(135deg, #1a4a2e 0%, #0d2d1a 100%);
      color: white;
      padding: 14px 18px;
      border-radius: 20px;
      border-bottom-right-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(26,74,46,0.4);
      z-index: 9998;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 280px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .chat-bubble.hidden { display: none; }

    .chat-iframe-wrap {
      position: fixed;
      bottom: 100px;
      right: 20px;
      width: 400px;
      height: 600px;
      max-width: calc(100vw - 40px);
      max-height: calc(100vh - 140px);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 60px rgba(0,0,0,0.3);
      z-index: 9999;
      display: none;
      background: #fff;
    }
    .chat-iframe-wrap.active {
      display: block;
      animation: chatSlideUp 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes chatSlideUp {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .chat-iframe-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    @media (max-width: 768px) {
      .chat-iframe-wrap {
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100%; height: 100%;
        max-width: 100%; max-height: 100vh;
        border-radius: 0;
      }
      .chat-bubble { bottom: 95px; right: 15px; max-width: 220px; font-size: 13px; }
      .chat-toggle-btn { bottom: 15px; right: 15px; width: 60px; height: 60px; }
    }
  </style>

  <div class="chat-bubble" id="chatBubble">
    <span>👋</span>
    <span id="chatBubbleText">Curious about my projects?</span>
  </div>

  <button class="chat-toggle-btn" id="chatToggleBtn" aria-label="Open chat with Satyesh's assistant">
    <span class="chat-badge" id="chatBadge">1</span>
    <img src="https://i.postimg.cc/DZxyy1b3/logochat.png" alt="Chat with Satyesh's assistant" />
    <svg viewBox="0 0 24 24" class="chat-close-icon"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
  </button>

  <div class="chat-iframe-wrap" id="chatIframeWrap">
    <iframe id="chatIframeEl" src="" title="Satyesh's Portfolio Chatbot" loading="lazy"></iframe>
  </div>

  <script>
    (function () {
      // Live chatbot deployment — update this app on Vercel and the
      // widget here updates automatically, no code changes needed.
      const CHATBOT_URL = "https://satyesh-portfolio-chatbot.vercel.app/";

      const toggleBtn   = document.getElementById('chatToggleBtn');
      const iframeWrap  = document.getElementById('chatIframeWrap');
      const iframeEl    = document.getElementById('chatIframeEl');
      const bubble      = document.getElementById('chatBubble');
      const bubbleText  = document.getElementById('chatBubbleText');
      const badge       = document.getElementById('chatBadge');

      let loaded = false;

      toggleBtn.addEventListener('click', () => {
        const opening = !iframeWrap.classList.contains('active');

        if (opening && !loaded) {
          iframeEl.src = CHATBOT_URL;
          loaded = true;
        }

        iframeWrap.classList.toggle('active', opening);
        toggleBtn.classList.toggle('active', opening);
        bubble.classList.toggle('hidden', opening);
        if (opening) badge.classList.add('hidden');
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && iframeWrap.classList.contains('active')) {
          toggleBtn.click();
        }
      });

      // Rotate the little teaser bubble above the button
      const bubbleMessages = [
        "Curious about my projects?",
        "How can I help you today?",
        "Ask me about my skills & experience!",
        "Want my resume or contact info?"
      ];
      let idx = 0;
      setInterval(() => {
        if (bubble.classList.contains('hidden')) return;
        idx = (idx + 1) % bubbleMessages.length;
        bubbleText.style.transition = 'opacity 0.3s ease';
        bubbleText.style.opacity = 0;
        setTimeout(() => {
          bubbleText.textContent = bubbleMessages[idx];
          bubbleText.style.opacity = 1;
        }, 300);
      }, 4000);
    })();
  </script>
